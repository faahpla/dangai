name: release

# Empacota e publica a partir do GITHUB, e nao da maquina de casa.
#
# POR QUE ISTO EXISTE:
#
# O NSIS so consegue gerar o desinstalador EXECUTANDO um .exe que ele mesmo
# acabou de compilar. Esse arquivo nasce sem assinatura e sem reputacao, e o
# Smart App Control do Windows -- ligado em modo de bloqueio na maquina de casa
# desde 23/09/2026 -- recusa roda-lo. O Node traduz a recusa como
# `spawn UNKNOWN`, sem dizer o motivo, e o empacotamento morre sempre no mesmo
# ponto:
#
#     spawn UNKNOWN   failedTask=build
#       at WineVmManager.execWine
#       at NsisTarget.computeScriptAndSignUninstaller
#
# O log do Windows e que conta a verdade (evento 3077, "Smart App Control
# Block"): o executavel "did not meet the Enterprise signing level
# requirements". Assinar resolveria, mas este projeto nao tem certificado.
# Desligar a politica tambem resolveria, e ela so volta a ligar reinstalando o
# Windows.
#
# O runner do GitHub nao tem essa politica. A build volta a rodar, e de quebra
# deixa de depender do estado de UMA maquina.
#
# QUEM PUBLICA CONTINUA SENDO `scripts/release.mjs`, o mesmo de sempre. As
# conferencias que ele carrega -- a tag existir no remoto e apontar para este
# commit, o latest.yml ser desta versao e o tamanho nele bater com o do arquivo
# -- nasceram de tres publicacoes perdidas e valem aqui como valiam la.

on:
  push:
    tags: ['v*']

  # A tag pode ja existir quando este arquivo nasce, e tag empurrada de novo nao
  # dispara nada. Este gatilho cobre esse caso -- e qualquer republicacao.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ex: v1.31.0)'
        required: true
      # Monta e confere sem publicar nada. Serve para provar o caminho depois de
      # mexer no workflow, sem gastar uma release de verdade para descobrir.
      dry_run:
        description: 'So ensaiar: empacota e confere, sem publicar'
        type: boolean
        default: false

# Sem isto o `gh release create` morre com 403 -- e so depois de todo o tempo de
# empacotamento, que e o pior lugar possivel para descobrir.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # A TAG, e nao o branch: o `release.mjs` exige que o HEAD seja o commit da
      # tag, e o `package.json` que ele le tem que ser o daquele commit.
      # `fetch-depth: 0` traz as tags junto, que o script resolve com `^{commit}`.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: empacotar e publicar
        run: npm run release ${{ inputs.dry_run && '-- --dry-run' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # O PACOTE EM PASTA, para quem o Smart App Control barra.
      #
      # O SAC recusa executar binario NOVO e sem assinatura, e o instalador
      # NSIS e exatamente isso a cada versao: ele barrou a 1.31.0 seis vezes
      # seguidas na maquina dele, com a versao ja baixada e conferida no
      # disco. O mesmo SAC deixa o `Dangai.exe` abrir sem reclamar -- medido
      # antes de escrever isto. O que ele barra e o instalador, nao o app.
      #
      # Entao a pasta pronta vai zipada junto. Trocar os arquivos do app nao
      # executa instalador nenhum, e e o unico caminho de atualizacao que
      # funciona enquanto o projeto nao tiver certificado.
      #
      # ZIPA O CONTEUDO, e nao a pasta: o destino e substituir o que esta em
      # `AppData\Local\Programs\Dangai`, entao o que sai do zip tem que ser
      # exatamente aquilo, sem um nivel a mais no meio.
      #
      # FICA FORA DO latest.yml de proposito. O updater do Windows so sabe
      # instalar pelo NSIS, e o latest.yml e o unico arquivo do pacote que,
      # errado, deixa TODO MUNDO sem atualizacao -- nao e onde se experimenta.
      #
      # O ENSAIO MONTA O ZIP e para antes de publicar. So o `gh upload` fica
      # sem prova, e e a linha que menos pode dar errado -- ja o 7z, o caminho
      # e o diretorio de trabalho sao justamente o que quebra num runner que
      # nao e a sua maquina, e isso da para exercitar sem gastar uma release.
      - name: pacote em pasta, para quem o instalador e barrado
        shell: pwsh
        run: |
          $versao = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "$PWD/release/Dangai-$versao-win-x64.zip"
          Push-Location release/win-unpacked
          7z a -tzip -mx=5 $zip *
          if ($LASTEXITCODE -ne 0) { throw "7z saiu com $LASTEXITCODE" }
          Pop-Location
          "{0:N0} MB" -f ((Get-Item $zip).Length / 1MB)
          if ('${{ inputs.dry_run }}' -eq 'true') {
            'ensaio -- zip montado, nao publicado'
            exit 0
          }
          gh release upload "v$versao" $zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Se quebrar no empacotamento, o que sobrou fica aqui para olhar. Sem
      # isto o runner some e leva o builder-debug.yml junto.
      - name: guardar os restos quando quebra
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-quebrada
          path: |
            release/latest.yml
            release/builder-debug.yml
          retention-days: 5
          if-no-files-found: ignore
